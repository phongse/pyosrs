[project]
name = "pyosrs"
version = "0.1.0"
description = "A Python library for Old School RuneScape APIs"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Phong Tran", email = "540580+phongse@users.noreply.github.com" }
]
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.12.5",
]

[build-system]
requires = ["uv_build>=0.9.13,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "basedpyright>=1.34.0",
    "coverage>=7.12.0",
    "factory-boy>=3.3.3",
    "pip-audit>=2.9.0",
    "pre-commit>=4.5.0",
    "pytest>=9.0.1",
    "pytest-asyncio>=1.3.0",
    "respx>=0.22.0",
    "ruff>=0.14.7",
    "ty>=0.0.1a29",
]
